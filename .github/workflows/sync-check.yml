              echo "DIFF: $file differs between clawd-skills/svm and clawd-cursor/skills/svm"
              diff --unified=3 "$SKILLS_DIR/$file" "$CURSOR_DIR/$file" | head -20
              echo "..."
              DIFF_FOUND=1
            fi
          done

          if [ "$DIFF_FOUND" -eq 1 ]; then
            echo "SVM reference files are out of sync!"
            echo "The canonical source is clawd-skills/svm/references/."
            echo "Copy changes to clawd-cursor/skills/svm/references/ to fix."
            exit 1
          fi

          echo "All SVM reference files (clawd-cursor) are in sync."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify generated skills and prompts are fresh
        run: |
          npx tsx scripts/compile-skills.ts

          if ! git diff --quiet .agents/ clawd-mcp/system-prompts/; then
            echo ""
            echo "Generated skill output is stale!"
            echo ""
            git diff --stat .agents/ clawd-mcp/system-prompts/
            echo ""
            echo "Run 'npx tsx scripts/compile-skills.ts' and commit the output."
            exit 1
          fi

          STALE=$(git status --porcelain .agents/ clawd-mcp/system-prompts/)
          if [ -n "$STALE" ]; then
            echo ""
            echo "Stale or untracked files detected in generated output:"
            echo "$STALE"
            echo ""
            echo "Run 'npx tsx scripts/compile-skills.ts', review the changes, and commit."
            exit 1
          fi

          echo "All generated skill output is up to date."
