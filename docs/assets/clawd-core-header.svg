<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Clawd Core</title>
  <desc id="desc">Animated Clawd Core banner  lobster-native Solana agent stack</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0d1020"/>
      <stop offset="100%" stop-color="#12081c"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9945FF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#c4a6ff"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a4a"/>
      <stop offset="100%" stop-color="#E35930"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14F195" stroke-width="0.6" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.7">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="6s" repeatCount="indefinite"/>
  </rect>

  <circle cx="180" cy="70" r="90" fill="#9945FF" opacity="0.16" filter="url(#soft)">
    <animate attributeName="r" values="80;110;80" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="240" r="120" fill="#14F195" opacity="0.1" filter="url(#soft)">
    <animate attributeName="r" values="100;140;100" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="#14F195" opacity="0.35">
    <animate attributeName="y" values="-4;324;-4" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- particles -->
  <g fill="#14F195">
    <circle cx="240" cy="48" r="2.2">
      <animate attributeName="cy" values="48;36;48" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="70" r="2">
      <animate attributeName="cy" values="70;54;70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="120" r="1.8" fill="#9945FF">
      <animate attributeName="cy" values="120;100;120" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="200" r="1.6">
      <animate attributeName="cx" values="70;90;70" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="50" r="1.5" fill="#ff7a4a">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- lobster -->
  <g transform="translate(88,78) scale(0.92)">
    <g filter="url(#glow)">
      <!-- tail -->
      <ellipse cx="38" cy="92" rx="22" ry="14" fill="url(#claw)" transform="rotate(-18 38 92)"/>
      <ellipse cx="18" cy="104" rx="16" ry="11" fill="#E35930" opacity="0.9" transform="rotate(-28 18 104)"/>
      <!-- body -->
      <ellipse cx="78" cy="78" rx="42" ry="28" fill="url(#claw)"/>
      <ellipse cx="118" cy="70" rx="28" ry="22" fill="#ff6b45"/>
      <!-- head -->
      <ellipse cx="154" cy="62" rx="22" ry="18" fill="url(#claw)"/>
      <circle cx="162" cy="54" r="4.2" fill="#14F195">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="162" cy="54" r="1.6" fill="#07110c"/>
      <!-- antennae -->
      <path d="M166 46 C178 18 198 12 214 8" fill="none" stroke="#ff7a4a" stroke-width="2.4" stroke-linecap="round">
        <animate attributeName="d" values="M166 46 C178 18 198 12 214 8;M166 46 C180 22 204 8 218 16;M166 46 C178 18 198 12 214 8" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M158 44 C164 16 150 6 138 2" fill="none" stroke="#E35930" stroke-width="2.2" stroke-linecap="round">
        <animate attributeName="d" values="M158 44 C164 16 150 6 138 2;M158 44 C160 20 142 10 128 8;M158 44 C164 16 150 6 138 2" dur="3.1s" repeatCount="indefinite"/>
      </path>
      <!-- walking legs -->
      <g stroke="#E35930" stroke-width="3.2" stroke-linecap="round" fill="none">
        <path d="M70 100 L58 128"><animateTransform attributeName="transform" type="rotate" values="-6 70 100;8 70 100;-6 70 100" dur="0.7s" repeatCount="indefinite"/></path>
        <path d="M88 102 L84 132"><animateTransform attributeName="transform" type="rotate" values="8 88 102;-6 88 102;8 88 102" dur="0.7s" repeatCount="indefinite"/></path>
        <path d="M106 98 L118 128"><animateTransform attributeName="transform" type="rotate" values="-5 106 98;7 106 98;-5 106 98" dur="0.7s" repeatCount="indefinite"/></path>
      </g>
      <!-- claws -->
      <g transform="translate(168,58)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="8 0 0;-12 0 0;8 0 0" dur="2.2s" repeatCount="indefinite"/>
          <path d="M0 0 C18 -18 44 -16 56 -2 C42 6 24 10 8 8 Z" fill="url(#claw)"/>
          <path d="M18 2 C32 14 48 12 58 4 C46 18 28 16 16 8 Z" fill="#c94a28"/>
        </g>
      </g>
      <g transform="translate(148,78)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-6 0 0;14 0 0;-6 0 0" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
          <path d="M0 0 C12 16 34 22 48 14 C34 8 16 4 4 2 Z" fill="#ff6b45"/>
          <path d="M14 10 C26 24 42 22 50 14 C40 26 24 22 12 14 Z" fill="#E35930"/>
        </g>
      </g>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(310,78)">
    <text x="0" y="0" fill="#14F195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="6">
      CORE AI  ·  SOLANA AGENTS
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="62" fill="url(#titleGrad)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">CLAWD CORE</text>
    <text x="0" y="102" fill="#9aa7c2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">
      Lobster-native stack. Clawd is the identity. Helius is the pipe.
    </text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#14F195">
      <text x="0" y="142">clawd-mcp</text>
      <text x="110" y="142" fill="#9945FF">clawd-cli</text>
      <text x="214" y="142" fill="#ff7a4a">clawd-plugin</text>
      <text x="348" y="142" fill="#c4a6ff">membrain</text>
      <text x="450" y="142" fill="#14F195">grok-4.6</text>
    </g>
  </g>

  <!-- waves -->
  <path fill="url(#waveFill)" d="M0 268 C 150 248 250 292 400 270 C 550 248 650 292 800 268 C 950 246 1050 286 1200 264 L 1200 320 L 0 320 Z">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="
      M0 268 C 150 248 250 292 400 270 C 550 248 650 292 800 268 C 950 246 1050 286 1200 264 L 1200 320 L 0 320 Z;
      M0 274 C 150 294 250 250 400 272 C 550 294 650 250 800 276 C 950 294 1050 252 1200 272 L 1200 320 L 0 320 Z;
      M0 268 C 150 248 250 292 400 270 C 550 248 650 292 800 268 C 950 246 1050 286 1200 264 L 1200 320 L 0 320 Z"/>
  </path>
  <path fill="#14F195" opacity="0.12" d="M0 286 C 180 270 280 304 460 286 C 640 268 740 306 920 286 C 1060 272 1140 298 1200 284 L 1200 320 L 0 320 Z">
    <animate attributeName="d" dur="4.5s" repeatCount="indefinite" values="
      M0 286 C 180 270 280 304 460 286 C 640 268 740 306 920 286 C 1060 272 1140 298 1200 284 L 1200 320 L 0 320 Z;
      M0 292 C 180 308 280 274 460 292 C 640 308 740 272 920 294 C 1060 308 1140 276 1200 290 L 1200 320 L 0 320 Z;
      M0 286 C 180 270 280 304 460 286 C 640 268 740 306 920 286 C 1060 272 1140 298 1200 284 L 1200 320 L 0 320 Z"/>
  </path>
</svg>
