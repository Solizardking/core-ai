<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="mapTitle">
  <title id="mapTitle">Clawd Core architecture map</title>
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0c1020"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142033"/>
      <stop offset="100%" stop-color="#10182a"/>
    </linearGradient>
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14F195"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9945FF"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7a4a"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="18" fill="url(#mapBg)"/>
  <rect x="1" y="1" width="1198" height="638" rx="18" fill="none" stroke="#1e2a44" stroke-width="1.2"/>

  <text x="40" y="42" fill="#14F195" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="3">LIVE MAP</text>
  <text x="40" y="74" fill="#f4f7ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Clawd Core  how the stack talks</text>
  <text x="40" y="100" fill="#8ea0bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Agents on top. Core in the middle. Chain and docs at the edge. Packets never stop.</text>

  <!-- layer labels -->
  <text x="40" y="140" fill="#9945FF" font-family="ui-monospace, Menlo, monospace" font-size="12">01  AGENTS</text>
  <text x="40" y="292" fill="#14F195" font-family="ui-monospace, Menlo, monospace" font-size="12">02  CLAWD CORE</text>
  <text x="40" y="478" fill="#ff7a4a" font-family="ui-monospace, Menlo, monospace" font-size="12">03  CHAIN  ·  DOCS  ·  MEMORY</text>

  <!-- agent nodes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(40,156)">
      <rect width="170" height="72" rx="12" fill="url(#cardA)" stroke="#9945FF" stroke-width="1.4"/>
      <text x="16" y="30" fill="#ffffff" font-size="15" font-weight="700">clawd-code</text>
      <text x="16" y="52" fill="#8ea0bf" font-size="12">code · trade · voice</text>
    </g>
    <g transform="translate(230,156)">
      <rect width="170" height="72" rx="12" fill="url(#cardA)" stroke="#9945FF" stroke-width="1.4"/>
      <text x="16" y="30" fill="#ffffff" font-size="15" font-weight="700">clawd-grok</text>
      <text x="16" y="52" fill="#8ea0bf" font-size="12">grok-4.6 · bun REPL</text>
    </g>
    <g transform="translate(420,156)">
      <rect width="170" height="72" rx="12" fill="url(#cardA)" stroke="#9945FF" stroke-width="1.4"/>
      <text x="16" y="30" fill="#ffffff" font-size="15" font-weight="700">clawd-agents</text>
      <text x="16" y="52" fill="#8ea0bf" font-size="12">phoenix · vulcan · twamm</text>
    </g>
    <g transform="translate(610,156)">
      <rect width="170" height="72" rx="12" fill="url(#cardA)" stroke="#9945FF" stroke-width="1.4"/>
      <text x="16" y="30" fill="#ffffff" font-size="15" font-weight="700">v3</text>
      <text x="16" y="52" fill="#8ea0bf" font-size="12">next runtime scaffold</text>
    </g>
    <g transform="translate(800,156)">
      <rect width="170" height="72" rx="12" fill="url(#cardA)" stroke="#9945FF" stroke-width="1.4"/>
      <text x="16" y="30" fill="#ffffff" font-size="15" font-weight="700">ai-training</text>
      <text x="16" y="52" fill="#8ea0bf" font-size="12">LoRA · HF Jobs · W&amp;B</text>
    </g>
    <g transform="translate(990,156)">
      <rect width="170" height="72" rx="12" fill="url(#cardA)" stroke="#9945FF" stroke-width="1.4"/>
      <text x="16" y="30" fill="#ffffff" font-size="15" font-weight="700">knowledge</text>
      <text x="16" y="52" fill="#8ea0bf" font-size="12">facts · gotchas · ADRs</text>
    </g>
  </g>

  <!-- core nodes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(40,308)">
      <rect width="210" height="88" rx="12" fill="url(#cardA)" stroke="#14F195" stroke-width="1.6"/>
      <text x="16" y="32" fill="#14F195" font-size="16" font-weight="700">clawd-plugin</text>
      <text x="16" y="54" fill="#8ea0bf" font-size="12">skills + auto-start MCP</text>
      <text x="16" y="72" fill="#5e7194" font-size="11">clawd --plugin-dir ./clawd-plugin</text>
    </g>
    <g transform="translate(270,308)">
      <rect width="210" height="88" rx="12" fill="url(#cardA)" stroke="#14F195" stroke-width="1.6"/>
      <text x="16" y="32" fill="#14F195" font-size="16" font-weight="700">clawd-skills</text>
      <text x="16" y="54" fill="#8ea0bf" font-size="12">canonical SKILL.md source</text>
      <text x="16" y="72" fill="#5e7194" font-size="11">compile-skills.ts ’ .agents/</text>
    </g>
    <g transform="translate(500,308)">
      <rect width="210" height="88" rx="12" fill="url(#cardA)" stroke="#14F195" stroke-width="2"/>
      <text x="16" y="32" fill="#14F195" font-size="16" font-weight="700">clawd-mcp</text>
      <text x="16" y="54" fill="#8ea0bf" font-size="12">10 public tools · stdio</text>
      <text x="16" y="72" fill="#5e7194" font-size="11">npx clawd-mcp@latest</text>
      <rect x="0" y="0" width="210" height="88" rx="12" fill="none" stroke="#14F195" opacity="0.0">
        <animate attributeName="opacity" values="0.0;0.55;0.0" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(730,308)">
      <rect width="210" height="88" rx="12" fill="url(#cardA)" stroke="#14F195" stroke-width="1.6"/>
      <text x="16" y="32" fill="#14F195" font-size="16" font-weight="700">clawd-cli</text>
      <text x="16" y="54" fill="#8ea0bf" font-size="12">signup · DAS · stake · zk</text>
      <text x="16" y="72" fill="#5e7194" font-size="11">clawd-cli config set-api-key</text>
    </g>
    <g transform="translate(960,308)">
      <rect width="200" height="88" rx="12" fill="url(#cardA)" stroke="#14F195" stroke-width="1.6"/>
      <text x="16" y="32" fill="#14F195" font-size="16" font-weight="700">clawd-cursor</text>
      <text x="16" y="54" fill="#8ea0bf" font-size="12">rules · skills · MCP</text>
      <text x="16" y="72" fill="#5e7194" font-size="11">Cursor plugin package</text>
    </g>
  </g>

  <!-- chain nodes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(40,494)">
      <rect width="250" height="96" rx="12" fill="url(#cardA)" stroke="#ff7a4a" stroke-width="1.6"/>
      <text x="16" y="32" fill="#ff7a4a" font-size="16" font-weight="700">Helius RPC / DAS / Sender</text>
      <text x="16" y="54" fill="#8ea0bf" font-size="12">helius-sdk · HELIUS_API_KEY</text>
      <text x="16" y="74" fill="#5e7194" font-size="11">~/.helius  ·  Laserstream  ·  Wallet API</text>
    </g>
    <g transform="translate(310,494)">
      <rect width="200" height="96" rx="12" fill="url(#cardA)" stroke="#ff7a4a" stroke-width="1.4"/>
      <text x="16" y="32" fill="#ff7a4a" font-size="15" font-weight="700">mcp-server</text>
      <text x="16" y="54" fill="#8ea0bf" font-size="12">Pump SDK  ·  stdio/HTTP</text>
      <text x="16" y="74" fill="#5e7194" font-size="11">builds txs, does not submit</text>
    </g>
    <g transform="translate(530,494)">
      <rect width="200" height="96" rx="12" fill="url(#cardA)" stroke="#ff7a4a" stroke-width="1.4"/>
      <text x="16" y="32" fill="#ff7a4a" font-size="15" font-weight="700">solana-mcp</text>
      <text x="16" y="54" fill="#8ea0bf" font-size="12">official docs RAG</text>
      <text x="16" y="74" fill="#5e7194" font-size="11">HTTP :8080 /mcp</text>
    </g>
    <g transform="translate(750,494)">
      <rect width="200" height="96" rx="12" fill="url(#cardA)" stroke="#ff7a4a" stroke-width="1.4"/>
      <text x="16" y="32" fill="#ff7a4a" font-size="15" font-weight="700">ZK Compression</text>
      <text x="16" y="54" fill="#8ea0bf" font-size="12">Light Protocol MCP</text>
      <text x="16" y="74" fill="#5e7194" font-size="11">zkcompression.com/mcp</text>
    </g>
    <g transform="translate(970,494)">
      <rect width="190" height="96" rx="12" fill="url(#cardA)" stroke="#c4a6ff" stroke-width="1.6"/>
      <text x="16" y="32" fill="#c4a6ff" font-size="15" font-weight="700">membrain</text>
      <text x="16" y="54" fill="#8ea0bf" font-size="12">selective memory</text>
      <text x="16" y="74" fill="#5e7194" font-size="11">gRPC :9090  ·  SQLite</text>
    </g>
  </g>

  <!-- connectors -->
  <g fill="none" stroke-width="1.6" stroke-dasharray="6 8">
    <path id="p1" d="M125 228 L145 308" stroke="#9945FF" marker-end="url(#arrowP)"/>
    <path id="p2" d="M315 228 L375 308" stroke="#9945FF" marker-end="url(#arrowP)"/>
    <path id="p3" d="M505 228 L605 308" stroke="#14F195" marker-end="url(#arrowG)"/>
    <path id="p4" d="M695 228 L835 308" stroke="#9945FF" marker-end="url(#arrowP)"/>
    <path id="p5" d="M145 396 L165 494" stroke="#ff7a4a" marker-end="url(#arrowO)"/>
    <path id="p6" d="M605 396 L165 494" stroke="#14F195" marker-end="url(#arrowG)"/>
    <path id="p7" d="M835 396 L165 494" stroke="#14F195" marker-end="url(#arrowG)"/>
    <path id="p8" d="M605 396 L410 494" stroke="#ff7a4a" marker-end="url(#arrowO)"/>
    <path id="p9" d="M605 396 L630 494" stroke="#ff7a4a" marker-end="url(#arrowO)"/>
    <path id="p10" d="M315 228 L1065 494" stroke="#c4a6ff" marker-end="url(#arrowP)"/>
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.4s" repeatCount="indefinite"/>
  </g>

  <!-- packets -->
  <circle r="4.5" fill="#14F195" filter="url(#nodeGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#p3"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#ff7a4a" filter="url(#nodeGlow)">
    <animateMotion dur="2.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#p6"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#9945FF" filter="url(#nodeGlow)">
    <animateMotion dur="3s" repeatCount="indefinite" rotate="auto">
      <mpath href="#p1"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#c4a6ff" filter="url(#nodeGlow)">
    <animateMotion dur="3.4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#p10"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#14F195">
    <animateMotion dur="2.5s" begin="0.6s" repeatCount="indefinite">
      <mpath href="#p7"/>
    </animateMotion>
  </circle>
</svg>
